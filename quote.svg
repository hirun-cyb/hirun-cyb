<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <rect width="800" height="200" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="798" height="198" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="40" y="95" font-family="Georgia, serif" font-size="90" fill="#38bdf8" opacity="0.35">“</text>
  <text x="400" y="88" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#e2e8f0">Security is not a product,</text>
  <text x="400" y="124" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#38bdf8">but a process.</text>
  <rect x="300" y="142" width="200" height="2" fill="url(#line)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="173" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#94a3b8" letter-spacing="2">— BRUCE SCHNEIER</text>
  <circle cx="760" cy="30" r="5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
